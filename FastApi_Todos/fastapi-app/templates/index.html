<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f4ee;
            --surface: #ffffff;
            --surface-2: #f6faf4;
            --border: #dde4db;
            --accent: #5a9e2f;
            --accent-dark: #3d7a1a;
            --accent-hover: #4d8e25;
            --accent-bg: #edf7e3;
            --accent-glow: rgba(90, 158, 47, 0.18);
            --text: #1a2018;
            --text-2: #445040;
            --muted: #7a8a7e;
            --warn: #c47a00;
            --warn-bg: #fdf5e0;
            --warn-border: #f0c84a;
            --urgent: #cc2200;
            --urgent-bg: #fdf0ee;
            --urgent-border: #f0a090;
            --indigo: #6366f1;
            --indigo-bg: #eef0fd;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
            --shadow-lg: 0 12px 36px rgba(0,0,0,0.14);
            --radius: 14px;
            --radius-sm: 10px;
            --radius-xs: 7px;
        }

        [data-theme="dark"] {
            --bg: #0d1117;
            --surface: #161b22;
            --surface-2: #1c2128;
            --border: #30363d;
            --accent: #6fbe3a;
            --accent-dark: #4d9e1e;
            --accent-hover: #5caa28;
            --accent-bg: #1a2d0e;
            --accent-glow: rgba(111, 190, 58, 0.2);
            --text: #e6edf3;
            --text-2: #8b949e;
            --muted: #484f58;
            --warn: #d4a017;
            --warn-bg: #1f1a09;
            --warn-border: #7a5f00;
            --urgent: #f85149;
            --urgent-bg: #1f0e0d;
            --urgent-border: #6e2c28;
            --indigo: #818cf8;
            --indigo-bg: #1a1b3a;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
            --shadow-lg: 0 12px 36px rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
            transition: background 0.25s, color 0.25s;
        }

        /* ── App Header ── */
        .app-header {
            background: linear-gradient(140deg, #1e4010 0%, #2f6818 45%, #4a9028 100%);
            padding: 36px 24px 56px;
            position: relative;
            overflow: hidden;
        }

        [data-theme="dark"] .app-header {
            background: linear-gradient(140deg, #0d1f08 0%, #142e0a 45%, #1e4a10 100%);
        }

        .app-header::before {
            content: '';
            position: absolute;
            top: -60px; right: -60px;
            width: 320px; height: 320px;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
            pointer-events: none;
        }

        .app-header::after {
            content: '';
            position: absolute;
            bottom: -80px; left: -40px;
            width: 280px; height: 280px;
            background: rgba(255,255,255,0.03);
            border-radius: 50%;
            pointer-events: none;
        }

        .header-inner {
            max-width: 660px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
        }

        .header-left .header-eyebrow {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.5);
            margin-bottom: 6px;
        }

        .header-left .header-title {
            font-size: 30px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.6px;
            line-height: 1;
        }

        .header-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .header-right .header-date {
            font-size: 12px;
            color: rgba(255,255,255,0.55);
            font-weight: 300;
        }

        .header-right .header-greeting {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.75);
        }

        .theme-toggle {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.85);
            font-size: 15px;
            width: 32px; height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.18s;
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            background: rgba(255,255,255,0.2);
        }

        /* ── Stats Card ── */
        .stats-wrapper {
            max-width: 660px;
            margin: -28px auto 0;
            padding: 0 24px;
            position: relative;
            z-index: 2;
        }

        .stats-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 18px 24px 20px;
            transition: background 0.25s;
        }

        .stats-row {
            display: flex;
            gap: 0;
            margin-bottom: 14px;
        }

        .stat {
            flex: 1;
            text-align: center;
            padding: 0 8px;
            border-right: 1px solid var(--border);
        }

        .stat:last-child { border-right: none; }

        .stat-number {
            font-size: 26px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 3px;
            color: var(--text);
        }

        .stat-number.accent  { color: var(--accent); }
        .stat-number.indigo  { color: var(--indigo); }

        .stat-label {
            font-family: 'DM Mono', monospace;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
        }

        .progress-track {
            height: 5px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-dark), var(--accent), #7ec84a);
            border-radius: 3px;
            transition: width 0.55s cubic-bezier(0.4, 0, 0.2, 1);
            width: 0%;
        }

        /* ── Main ── */
        .main {
            max-width: 660px;
            margin: 20px auto 0;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* ── Add Form Card ── */
        .add-card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: background 0.25s;
        }

        .add-card-head {
            padding: 13px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface-2);
        }

        .add-card-icon {
            width: 22px; height: 22px;
            background: var(--accent-bg);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent);
            font-weight: 700;
            font-size: 16px;
            line-height: 1;
        }

        .add-card-head-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-2);
            letter-spacing: 0.01em;
        }

        .add-form-body {
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-row { display: flex; gap: 10px; }

        .field {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field label {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
        }

        .field input {
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            padding: 9px 13px;
            border-radius: var(--radius-xs);
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
        }

        .field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: var(--surface);
        }

        .field input::placeholder { color: var(--muted); opacity: 0.6; }

        .chip-section { display: flex; flex-direction: column; gap: 7px; }

        .chip-section .field-label {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
        }

        .chips-row { display: flex; gap: 6px; flex-wrap: wrap; }

        .chip {
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            color: var(--text-2);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            padding: 5px 13px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.02em;
        }

        .chip:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-bg);
        }

        .chip.selected {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* Priority chips */
        .chip.prio-high { border-color: var(--urgent-border); color: var(--urgent); background: var(--urgent-bg); }
        .chip.prio-high:hover, .chip.prio-high.selected { background: var(--urgent); border-color: var(--urgent); color: #fff; }
        .chip.prio-medium { border-color: var(--warn-border); color: var(--warn); background: var(--warn-bg); }
        .chip.prio-medium:hover, .chip.prio-medium.selected { background: var(--warn); border-color: var(--warn); color: #fff; }
        .chip.prio-low { border-color: var(--border); color: var(--muted); background: var(--surface-2); }
        .chip.prio-low:hover, .chip.prio-low.selected { background: var(--indigo); border-color: var(--indigo); color: #fff; }

        .form-footer {
            display: flex;
            justify-content: flex-end;
        }

        .btn-add {
            background: var(--accent);
            color: #fff;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 22px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-add:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .btn-add:active { transform: translateY(0); box-shadow: none; }

        .btn-add-icon {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.7);
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
            line-height: 1;
        }

        /* ── Search & Filter ── */
        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-wrap {
            flex: 1;
            position: relative;
        }

        .search-wrap svg {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            background: var(--surface);
            border: 1.5px solid var(--border);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            padding: 9px 13px 9px 35px;
            border-radius: var(--radius-sm);
            outline: none;
            transition: all 0.18s;
            box-shadow: var(--shadow-sm);
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-input::placeholder { color: var(--muted); opacity: 0.6; }

        .filter-tabs {
            display: flex;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 3px;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }

        .filter-tab {
            background: none;
            border: none;
            color: var(--muted);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .filter-tab:hover { color: var(--text-2); }
        .filter-tab.active { background: var(--accent); color: #fff; }

        .tab-count {
            display: inline-block;
            font-family: 'DM Mono', monospace;
            font-size: 9px;
            background: rgba(0,0,0,0.12);
            border-radius: 8px;
            padding: 1px 5px;
            margin-left: 3px;
            vertical-align: middle;
        }

        .filter-tab:not(.active) .tab-count {
            background: var(--border);
            color: var(--muted);
        }

        /* ── Sort bar ── */
        .sort-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2px;
        }

        .sort-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sort-bar-label {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .sort-bar-label span { color: var(--text-2); font-weight: 500; }

        .btn-clear {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 4px 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.14s;
        }

        .btn-clear:hover {
            border-color: var(--urgent-border);
            color: var(--urgent);
            background: var(--urgent-bg);
        }

        .sort-select {
            background: none;
            border: none;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            cursor: pointer;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .sort-select:hover { color: var(--text-2); }

        /* ── Todo List ── */
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .empty-state {
            background: var(--surface);
            border: 1.5px dashed var(--border);
            border-radius: var(--radius);
            padding: 52px 24px;
            text-align: center;
        }

        .empty-icon { font-size: 36px; margin-bottom: 14px; opacity: 0.35; display: block; }
        .empty-title { font-size: 15px; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
        .empty-sub { font-size: 13px; color: var(--muted); }

        /* ── Todo Card ── */
        .todo-card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s, opacity 0.25s, background 0.25s;
            animation: cardIn 0.22s ease;
            position: relative;
        }

        /* Priority left-border indicator */
        .todo-card.prio-high   { border-left: 3px solid var(--urgent); }
        .todo-card.prio-medium { border-left: 3px solid var(--warn); }
        .todo-card.prio-low    { border-left: 3px solid var(--indigo); }

        .todo-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
            border-color: #c8d5c5;
        }

        .todo-card.completed { opacity: 0.55; }
        .todo-card.completed:hover { opacity: 0.8; }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(-5px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Custom checkbox */
        .todo-check {
            width: 20px; height: 20px;
            min-width: 20px;
            border: 2px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.18s;
            margin-top: 1px;
            flex-shrink: 0;
        }

        .todo-check:hover { border-color: var(--accent); background: var(--accent-bg); }
        .todo-check.checked { background: var(--accent); border-color: var(--accent); }
        .todo-check.checked svg { display: block; }
        .todo-check svg { display: none; }

        .todo-body { flex: 1; min-width: 0; }

        .todo-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 3px;
        }

        .todo-title-row {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
            flex: 1;
        }

        .todo-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            transition: color 0.2s;
            line-height: 1.3;
        }

        .todo-card.completed .todo-title { text-decoration: line-through; color: var(--muted); }

        .done-pill {
            font-family: 'DM Mono', monospace;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            background: var(--accent-bg);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .todo-desc {
            font-size: 13px;
            color: var(--text-2);
            line-height: 1.45;
            margin-bottom: 7px;
        }

        .todo-card.completed .todo-desc { color: var(--muted); }

        .todo-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

        /* Badges */
        .badge {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            padding: 3px 9px;
            border-radius: 5px;
            letter-spacing: 0.03em;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge.due-normal   { background: var(--surface-2); color: var(--muted);  border: 1px solid var(--border); }
        .badge.due-warning  { background: var(--warn-bg);   color: var(--warn);   border: 1px solid var(--warn-border); }
        .badge.due-urgent   {
            background: var(--urgent-bg);
            color: var(--urgent);
            border: 1px solid var(--urgent-border);
            animation: urgentPulse 2s ease-in-out infinite;
        }

        .badge.prio-high   { background: var(--urgent-bg); color: var(--urgent); border: 1px solid var(--urgent-border); }
        .badge.prio-medium { background: var(--warn-bg);   color: var(--warn);   border: 1px solid var(--warn-border); }
        .badge.prio-low    { background: var(--indigo-bg); color: var(--indigo); border: 1px solid var(--border); }

        .badge.category { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }

        @keyframes urgentPulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.55; }
        }

        /* Action buttons */
        .todo-actions { display: flex; gap: 4px; flex-shrink: 0; }

        .icon-btn {
            width: 30px; height: 30px;
            border: 1.5px solid var(--border);
            background: none;
            color: var(--muted);
            border-radius: var(--radius-xs);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.14s;
            flex-shrink: 0;
        }

        .icon-btn:hover { border-color: var(--text); color: var(--text); }
        .icon-btn.edit:hover { border-color: var(--indigo); color: var(--indigo); background: var(--indigo-bg); }
        .icon-btn.delete:hover { border-color: var(--urgent); color: var(--urgent); background: var(--urgent-bg); }

        /* ── Edit Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(8, 18, 8, 0.55);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s;
        }

        .modal-overlay.open { opacity: 1; pointer-events: all; }

        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 440px;
            transform: scale(0.94) translateY(12px);
            transition: transform 0.28s cubic-bezier(0.34, 1.45, 0.64, 1), background 0.25s;
        }

        .modal-overlay.open .modal { transform: scale(1) translateY(0); }

        .modal-header {
            padding: 20px 22px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-title { font-size: 15px; font-weight: 700; color: var(--text); }

        .modal-close {
            width: 28px; height: 28px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 7px;
            cursor: pointer;
            color: var(--muted);
            font-size: 12px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.14s;
        }

        .modal-close:hover { background: var(--urgent-bg); border-color: var(--urgent-border); color: var(--urgent); }

        .modal-body {
            padding: 18px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-field { display: flex; flex-direction: column; gap: 5px; }

        .modal-field label {
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
        }

        .modal-field input {
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            padding: 9px 13px;
            border-radius: var(--radius-xs);
            outline: none;
            transition: all 0.18s;
        }

        .modal-field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: var(--surface);
        }

        .modal-field input[type="date"] {
            color-scheme: light dark;
        }

        [data-theme="dark"] .modal-field input[type="date"] {
            color-scheme: dark;
        }

        .modal-field .chips-row { margin-top: 2px; }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--surface-2);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-xs);
        }

        .toggle-label { font-size: 13px; font-weight: 500; color: var(--text-2); }

        .toggle {
            width: 38px; height: 21px;
            background: var(--border);
            border-radius: 11px;
            cursor: pointer;
            position: relative;
            transition: background 0.2s;
            border: none;
            flex-shrink: 0;
        }

        .toggle.on { background: var(--accent); }

        .toggle::after {
            content: '';
            position: absolute;
            width: 15px; height: 15px;
            background: #fff;
            border-radius: 50%;
            top: 3px; left: 3px;
            transition: left 0.18s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        .toggle.on::after { left: 20px; }

        .modal-footer {
            padding: 0 22px 20px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .btn-cancel {
            background: none;
            border: 1.5px solid var(--border);
            color: var(--text-2);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: all 0.14s;
        }

        .btn-cancel:hover { border-color: var(--text); }

        .btn-save {
            background: var(--accent);
            color: #fff;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 22px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: all 0.18s;
        }

        .btn-save:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-save:active { transform: translateY(0); }

        /* ── Delete Confirm ── */
        .confirm-overlay {
            position: fixed;
            inset: 0;
            background: rgba(8,18,8,0.45);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s;
        }

        .confirm-overlay.open { opacity: 1; pointer-events: all; }

        .confirm-box {
            background: var(--surface);
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            padding: 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
            transform: scale(0.92);
            transition: transform 0.22s cubic-bezier(0.34,1.45,0.64,1), background 0.25s;
        }

        .confirm-overlay.open .confirm-box { transform: scale(1); }

        .confirm-icon { font-size: 28px; margin-bottom: 12px; }
        .confirm-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
        .confirm-sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }

        .confirm-actions { display: flex; gap: 8px; justify-content: center; }

        .btn-confirm-cancel {
            background: none;
            border: 1.5px solid var(--border);
            color: var(--text-2);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 20px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: all 0.14s;
        }

        .btn-confirm-cancel:hover { border-color: var(--text); }

        .btn-confirm-delete {
            background: var(--urgent);
            color: #fff;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: all 0.18s;
        }

        .btn-confirm-delete:hover { opacity: 0.88; }

        /* ── Toast ── */
        .toast-container {
            position: fixed;
            bottom: 24px; right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 300;
            pointer-events: none;
        }

        .toast {
            font-size: 13px;
            font-weight: 500;
            padding: 11px 16px;
            border-radius: var(--radius-xs);
            box-shadow: var(--shadow-md);
            max-width: 280px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: toastIn 0.25s ease;
        }

        .toast.success { background: #1c3d10; color: #a8e87a; border-left: 3px solid var(--accent); }
        .toast.error   { background: #3d1010; color: #f5a0a0; border-left: 3px solid var(--urgent); }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(18px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @keyframes toastOut {
            from { opacity: 1; transform: translateX(0); }
            to   { opacity: 0; transform: translateX(18px); }
        }

        /* ── Responsive ── */
        @media (max-width: 520px) {
            .input-row         { flex-direction: column; }
            .toolbar           { flex-direction: column; align-items: stretch; }
            .filter-tabs       { justify-content: center; }
            .header-inner      { flex-direction: column; align-items: flex-start; gap: 8px; }
            .header-right      { text-align: left; align-items: flex-start; }
        }
    </style>
</head>
<body>

    <!-- ── Header ── -->
    <header class="app-header">
        <div class="header-inner">
            <div class="header-left">
                <div class="header-eyebrow">// workspace</div>
                <div class="header-title">To-Do</div>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode">🌙</button>
                <div class="header-greeting" id="header-greeting"></div>
                <div class="header-date" id="header-date"></div>
            </div>
        </div>
    </header>

    <!-- ── Stats ── -->
    <div class="stats-wrapper">
        <div class="stats-card">
            <div class="stats-row">
                <div class="stat">
                    <div class="stat-number" id="stat-total">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat">
                    <div class="stat-number accent" id="stat-done">0</div>
                    <div class="stat-label">Done</div>
                </div>
                <div class="stat">
                    <div class="stat-number indigo" id="stat-left">0</div>
                    <div class="stat-label">Remaining</div>
                </div>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- ── Main ── -->
    <main class="main">

        <!-- Add Form -->
        <div class="add-card">
            <div class="add-card-head">
                <div class="add-card-icon">+</div>
                <span class="add-card-head-label">New Task</span>
            </div>
            <form id="todo-form">
                <div class="add-form-body">
                    <div class="input-row">
                        <div class="field">
                            <label>Title</label>
                            <input type="text" id="title" placeholder="Task title" required autocomplete="off">
                        </div>
                        <div class="field">
                            <label>Description</label>
                            <input type="text" id="description" placeholder="Add a note..." autocomplete="off">
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="chip-section" style="flex:1">
                            <div class="field-label">Priority</div>
                            <div class="chips-row">
                                <button type="button" class="chip prio-high"   data-prio="high">⬆ High</button>
                                <button type="button" class="chip prio-medium" data-prio="medium">● Medium</button>
                                <button type="button" class="chip prio-low"    data-prio="low">⬇ Low</button>
                            </div>
                        </div>
                        <div class="field" style="flex:1">
                            <label>Category</label>
                            <input type="text" id="category" placeholder="e.g. work, personal..." autocomplete="off">
                        </div>
                    </div>
                    <div class="chip-section">
                        <div class="field-label">Due date</div>
                        <div class="chips-row">
                            <button type="button" class="chip" data-due="today">today</button>
                            <button type="button" class="chip" data-due="tomorrow">tomorrow</button>
                            <button type="button" class="chip" data-due="week">this week</button>
                            <button type="button" class="chip" data-due="month">this month</button>
                        </div>
                    </div>
                    <div class="form-footer">
                        <button type="submit" class="btn-add">
                            <div class="btn-add-icon">+</div>
                            Add Task
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-wrap">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                </svg>
                <input type="text" class="search-input" id="search-input" placeholder="Search tasks..." autocomplete="off">
            </div>
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">All <span class="tab-count" id="count-all"></span></button>
                <button class="filter-tab" data-filter="active">Active <span class="tab-count" id="count-active"></span></button>
                <button class="filter-tab" data-filter="done">Done <span class="tab-count" id="count-done"></span></button>
            </div>
        </div>

        <!-- Sort / count bar -->
        <div class="sort-bar">
            <div class="sort-bar-left">
                <div class="sort-bar-label">Showing <span id="visible-count">0</span> tasks</div>
                <button class="btn-clear" id="btn-clear-completed">Clear done</button>
            </div>
            <select class="sort-select" id="sort-select">
                <option value="due">Sort: due date</option>
                <option value="priority">Sort: priority</option>
                <option value="title">Sort: title</option>
                <option value="status">Sort: status</option>
            </select>
        </div>

        <!-- Todo list -->
        <div class="todo-list" id="todo-list"></div>

    </main>

    <!-- ── Edit Modal ── -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-title">Edit Task</div>
                <button class="modal-close" id="modal-close-btn">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-field">
                    <label>Title</label>
                    <input type="text" id="edit-title" autocomplete="off">
                </div>
                <div class="modal-field">
                    <label>Description</label>
                    <input type="text" id="edit-description" autocomplete="off">
                </div>
                <div class="modal-field">
                    <label>Category</label>
                    <input type="text" id="edit-category" placeholder="e.g. work, personal..." autocomplete="off">
                </div>
                <div class="modal-field">
                    <label>Due date</label>
                    <input type="date" id="edit-due" autocomplete="off">
                </div>
                <div class="modal-field">
                    <label>Priority</label>
                    <div class="chips-row">
                        <button type="button" class="chip prio-high"   data-edit-prio="high">⬆ High</button>
                        <button type="button" class="chip prio-medium" data-edit-prio="medium">● Medium</button>
                        <button type="button" class="chip prio-low"    data-edit-prio="low">⬇ Low</button>
                        <button type="button" class="chip"             data-edit-prio="none">✕ None</button>
                    </div>
                </div>
                <div class="toggle-row">
                    <span class="toggle-label">Mark as completed</span>
                    <button type="button" class="toggle" id="edit-toggle"></button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="modal-cancel-btn">Cancel</button>
                <button class="btn-save" id="modal-save-btn">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- ── Delete Confirm ── -->
    <div class="confirm-overlay" id="confirm-overlay">
        <div class="confirm-box">
            <div class="confirm-icon">🗑</div>
            <div class="confirm-title">Delete this task?</div>
            <div class="confirm-sub">This action cannot be undone.</div>
            <div class="confirm-actions">
                <button class="btn-confirm-cancel" id="confirm-cancel-btn">Cancel</button>
                <button class="btn-confirm-delete" id="confirm-delete-btn">Delete</button>
            </div>
        </div>
    </div>

    <!-- ── Toast Container ── -->
    <div class="toast-container" id="toast-container"></div>

    <script>
        /* ── State ── */
        let allTodos     = [];
        let filter       = 'all';
        let sortMode     = 'due';
        let searchQuery  = '';
        let selectedDue  = null;
        let selectedPrio = null;
        let editingTodo  = null;
        let deletingId   = null;
        let editPrio     = null;

        const PRIO_ORDER = { high: 0, medium: 1, low: 2, null: 3, undefined: 3 };

        /* ── Dark mode ── */
        const themeToggle = document.getElementById('theme-toggle');
        const savedTheme  = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggle.addEventListener('click', () => {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
        });

        /* ── Header ── */
        (function () {
            const now   = new Date();
            const hr    = now.getHours();
            const greet = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
            document.getElementById('header-greeting').textContent = greet;
            document.getElementById('header-date').textContent =
                now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        })();

        /* ── Due chip toggle ── */
        document.querySelectorAll('[data-due]').forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.dataset.due;
                if (selectedDue === val) {
                    selectedDue = null;
                    btn.classList.remove('selected');
                } else {
                    document.querySelectorAll('[data-due]').forEach(b => b.classList.remove('selected'));
                    selectedDue = val;
                    btn.classList.add('selected');
                }
            });
        });

        /* ── Priority chip toggle (add form) ── */
        document.querySelectorAll('[data-prio]').forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.dataset.prio;
                if (selectedPrio === val) {
                    selectedPrio = null;
                    btn.classList.remove('selected');
                } else {
                    document.querySelectorAll('[data-prio]').forEach(b => b.classList.remove('selected'));
                    selectedPrio = val;
                    btn.classList.add('selected');
                }
            });
        });

        /* ── Priority chip toggle (edit modal) ── */
        document.querySelectorAll('[data-edit-prio]').forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.dataset.editPrio === 'none' ? null : btn.dataset.editPrio;
                editPrio = val;
                document.querySelectorAll('[data-edit-prio]').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            });
        });

        /* ── Filter tabs ── */
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                filter = tab.dataset.filter;
                renderTodos(allTodos);
            });
        });

        document.getElementById('search-input').addEventListener('input', e => {
            searchQuery = e.target.value.toLowerCase();
            renderTodos(allTodos);
        });

        document.getElementById('sort-select').addEventListener('change', e => {
            sortMode = e.target.value;
            renderTodos(allTodos);
        });

        /* ── Clear completed ── */
        document.getElementById('btn-clear-completed').addEventListener('click', async () => {
            const completed = allTodos.filter(t => t.completed);
            if (completed.length === 0) { showToast('No completed tasks to clear', 'error'); return; }
            await Promise.all(completed.map(t => fetch(`/todos/${t.id}`, { method: 'DELETE' })));
            showToast(`Cleared ${completed.length} completed task${completed.length > 1 ? 's' : ''}`, 'success');
            fetchTodos();
        });

        /* ── Stats ── */
        function updateStats(todos) {
            const total = todos.length;
            const done  = todos.filter(t => t.completed).length;
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-done').textContent  = done;
            document.getElementById('stat-left').textContent  = total - done;
            const pct = total > 0 ? Math.round((done / total) * 100) : 0;
            document.getElementById('progress-fill').style.width = pct + '%';
        }

        /* ── Date helpers ── */
        function formatDate(d) {
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function computeDueDate(option) {
            const today = new Date(); today.setHours(0,0,0,0);
            if (option === 'today')    return formatDate(today);
            if (option === 'tomorrow') { const d = new Date(today); d.setDate(d.getDate()+1); return formatDate(d); }
            if (option === 'week')     { const d = new Date(today); d.setDate(d.getDate()+(d.getDay()===0?7:7-d.getDay())); return formatDate(d); }
            if (option === 'month')    { return formatDate(new Date(today.getFullYear(), today.getMonth()+1, 0)); }
            return null;
        }

        function displayDate(dateStr) {
            const [y,m,d] = dateStr.split('-').map(Number);
            return new Date(y,m-1,d).toLocaleDateString('en-US', { month:'short', day:'numeric' });
        }

        function getDaysUntil(dateStr) {
            const today = new Date(); today.setHours(0,0,0,0);
            const [y,m,d] = dateStr.split('-').map(Number);
            return Math.ceil((new Date(y,m-1,d) - today) / 86400000);
        }

        /* ── Render ── */
        function applySort(list) {
            return [...list].sort((a, b) => {
                if (sortMode === 'title')    return a.title.localeCompare(b.title);
                if (sortMode === 'status')   return Number(a.completed) - Number(b.completed);
                if (sortMode === 'priority') return (PRIO_ORDER[a.priority] ?? 3) - (PRIO_ORDER[b.priority] ?? 3);
                if (!a.due && !b.due) return 0;
                if (!a.due) return 1;
                if (!b.due) return -1;
                return a.due.localeCompare(b.due);
            });
        }

        function renderTodos(todos) {
            document.getElementById('count-all').textContent    = todos.length || '';
            document.getElementById('count-active').textContent = todos.filter(t => !t.completed).length || '';
            document.getElementById('count-done').textContent   = todos.filter(t => t.completed).length || '';

            let list = todos;
            if (filter === 'active') list = list.filter(t => !t.completed);
            if (filter === 'done')   list = list.filter(t => t.completed);
            if (searchQuery) {
                list = list.filter(t =>
                    t.title.toLowerCase().includes(searchQuery) ||
                    (t.description || '').toLowerCase().includes(searchQuery) ||
                    (t.category || '').toLowerCase().includes(searchQuery)
                );
            }
            list = applySort(list);
            document.getElementById('visible-count').textContent = list.length;
            const container = document.getElementById('todo-list');
            container.innerHTML = '';

            if (list.length === 0) {
                const icon  = filter === 'done' ? '◎' : searchQuery ? '⊘' : '✓';
                const title = searchQuery ? 'No matching tasks'
                            : filter === 'done'   ? 'Nothing completed yet'
                            : filter === 'active' ? 'All caught up!'
                            : 'No tasks yet';
                const sub   = searchQuery ? 'Try a different search term'
                            : filter === 'active' ? 'Add a new task above to get started'
                            : 'Tasks you complete will appear here';
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="empty-icon">${icon}</span>
                        <div class="empty-title">${title}</div>
                        <div class="empty-sub">${sub}</div>
                    </div>`;
                return;
            }

            list.forEach(todo => {
                const card = document.createElement('div');
                const prioClass = todo.priority ? ` prio-${todo.priority}` : '';
                card.className = 'todo-card' + (todo.completed ? ' completed' : '') + prioClass;

                /* Checkbox */
                const check = document.createElement('div');
                check.className = 'todo-check' + (todo.completed ? ' checked' : '');
                check.innerHTML = '<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
                check.setAttribute('role', 'checkbox');
                check.setAttribute('aria-checked', String(!!todo.completed));
                check.onclick = () => toggleDone(todo);

                /* Body */
                const body = document.createElement('div');
                body.className = 'todo-body';

                const top = document.createElement('div');
                top.className = 'todo-top';

                const titleRow = document.createElement('div');
                titleRow.className = 'todo-title-row';

                const titleEl = document.createElement('span');
                titleEl.className = 'todo-title';
                titleEl.textContent = todo.title;
                titleRow.appendChild(titleEl);

                if (todo.completed) {
                    const pill = document.createElement('span');
                    pill.className = 'done-pill';
                    pill.textContent = 'done';
                    titleRow.appendChild(pill);
                }

                top.appendChild(titleRow);
                body.appendChild(top);

                if (todo.description) {
                    const descEl = document.createElement('div');
                    descEl.className = 'todo-desc';
                    descEl.textContent = todo.description;
                    body.appendChild(descEl);
                }

                /* Meta badges */
                const meta = document.createElement('div');
                meta.className = 'todo-meta';

                if (todo.priority) {
                    const pb = document.createElement('span');
                    const label = { high: '⬆ High', medium: '● Medium', low: '⬇ Low' }[todo.priority];
                    pb.className = `badge prio-${todo.priority}`;
                    pb.textContent = label;
                    meta.appendChild(pb);
                }

                if (todo.category) {
                    const cb = document.createElement('span');
                    cb.className = 'badge category';
                    cb.textContent = `# ${todo.category}`;
                    meta.appendChild(cb);
                }

                if (todo.due) {
                    const days  = getDaysUntil(todo.due);
                    const badge = document.createElement('span');
                    if (days < 0) {
                        badge.className = 'badge due-urgent';
                        badge.textContent = `⚠ overdue · ${displayDate(todo.due)}`;
                    } else if (days === 0) {
                        badge.className = 'badge due-urgent';
                        badge.textContent = `⚠ due today · ${displayDate(todo.due)}`;
                    } else if (days <= 3) {
                        badge.className = 'badge due-warning';
                        badge.textContent = `● ${days}d left · ${displayDate(todo.due)}`;
                    } else {
                        badge.className = 'badge due-normal';
                        badge.textContent = `○ ${displayDate(todo.due)}`;
                    }
                    meta.appendChild(badge);
                }

                if (meta.children.length) body.appendChild(meta);

                /* Actions */
                const actions = document.createElement('div');
                actions.className = 'todo-actions';

                const editBtn = document.createElement('button');
                editBtn.className = 'icon-btn edit';
                editBtn.title = 'Edit task';
                editBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708l-3-3zm.646 6.061L9.793 2.5 3.293 9H3.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.207l6.5-6.5zm-7.468 7.468A.5.5 0 0 1 6 13.5V13h-.5a.5.5 0 0 1-.5-.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.5-.5V10h-.5a.499.499 0 0 1-.175-.032l-.179.178a.5.5 0 0 0-.11.168l-2 5a.5.5 0 0 0 .65.65l5-2a.5.5 0 0 0 .168-.11l.178-.178z"/></svg>';
                editBtn.onclick = () => openModal(todo);

                const delBtn = document.createElement('button');
                delBtn.className = 'icon-btn delete';
                delBtn.title = 'Delete task';
                delBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4L4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/></svg>';
                delBtn.onclick = () => openConfirm(todo.id);

                actions.appendChild(editBtn);
                actions.appendChild(delBtn);

                card.appendChild(check);
                card.appendChild(body);
                card.appendChild(actions);
                container.appendChild(card);
            });
        }

        /* ── API ── */
        async function fetchTodos() {
            try {
                const res = await fetch('/todos');
                allTodos  = await res.json();
                updateStats(allTodos);
                renderTodos(allTodos);
            } catch { showToast('Failed to load tasks', 'error'); }
        }

        async function toggleDone(todo) {
            try {
                const res = await fetch(`/todos/${todo.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...todo, completed: !todo.completed })
                });
                if (res.ok) {
                    showToast(todo.completed ? 'Marked as active' : 'Task completed!', 'success');
                    fetchTodos();
                }
            } catch { showToast('Failed to update task', 'error'); }
        }

        async function deleteTodo(id) {
            try {
                const res = await fetch(`/todos/${id}`, { method: 'DELETE' });
                if (res.ok) { showToast('Task deleted', 'success'); fetchTodos(); }
            } catch { showToast('Failed to delete task', 'error'); }
        }

        document.getElementById('todo-form').addEventListener('submit', async e => {
            e.preventDefault();
            const title       = document.getElementById('title').value.trim();
            const description = document.getElementById('description').value.trim();
            const category    = document.getElementById('category').value.trim() || null;
            const due         = selectedDue ? computeDueDate(selectedDue) : null;

            try {
                const res = await fetch('/todos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: Date.now(), title, description, completed: false, due, priority: selectedPrio, category })
                });
                if (res.ok) {
                    e.target.reset();
                    document.querySelectorAll('[data-due]').forEach(b => b.classList.remove('selected'));
                    document.querySelectorAll('[data-prio]').forEach(b => b.classList.remove('selected'));
                    selectedDue = null; selectedPrio = null;
                    showToast('Task added!', 'success');
                    fetchTodos();
                }
            } catch { showToast('Failed to add task', 'error'); }
        });

        /* ── Edit Modal ── */
        function openModal(todo) {
            editingTodo = todo;
            editPrio    = todo.priority || null;
            document.getElementById('edit-title').value       = todo.title;
            document.getElementById('edit-description').value = todo.description;
            document.getElementById('edit-category').value    = todo.category || '';
            document.getElementById('edit-due').value         = todo.due || '';
            document.getElementById('edit-toggle').classList.toggle('on', !!todo.completed);

            document.querySelectorAll('[data-edit-prio]').forEach(b => {
                const v = b.dataset.editPrio === 'none' ? null : b.dataset.editPrio;
                b.classList.toggle('selected', v === editPrio);
            });

            document.getElementById('modal-overlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('open');
            editingTodo = null;
        }

        async function saveEdit() {
            if (!editingTodo) return;
            const title       = document.getElementById('edit-title').value.trim();
            const description = document.getElementById('edit-description').value.trim();
            const category    = document.getElementById('edit-category').value.trim() || null;
            const due         = document.getElementById('edit-due').value || null;
            const completed   = document.getElementById('edit-toggle').classList.contains('on');

            if (!title) { showToast('Title is required', 'error'); return; }

            try {
                const res = await fetch(`/todos/${editingTodo.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...editingTodo, title, description, category, due, completed, priority: editPrio })
                });
                if (res.ok) { closeModal(); showToast('Task updated!', 'success'); fetchTodos(); }
            } catch { showToast('Failed to update task', 'error'); }
        }

        document.getElementById('edit-toggle').addEventListener('click', function () { this.classList.toggle('on'); });
        document.getElementById('modal-close-btn').addEventListener('click', closeModal);
        document.getElementById('modal-cancel-btn').addEventListener('click', closeModal);
        document.getElementById('modal-save-btn').addEventListener('click', saveEdit);
        document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

        /* ── Delete Confirm ── */
        function openConfirm(id) {
            deletingId = id;
            document.getElementById('confirm-overlay').classList.add('open');
        }

        function closeConfirm() {
            document.getElementById('confirm-overlay').classList.remove('open');
            deletingId = null;
        }

        document.getElementById('confirm-cancel-btn').addEventListener('click', closeConfirm);
        document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
            if (deletingId !== null) { await deleteTodo(deletingId); closeConfirm(); }
        });
        document.getElementById('confirm-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeConfirm(); });

        /* ── Keyboard shortcuts ── */
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') { closeModal(); closeConfirm(); }
            if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                document.getElementById('search-input').focus();
            }
        });

        /* ── Toast ── */
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = `${type === 'success' ? '✓' : '✕'}  ${msg}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.25s ease forwards';
                setTimeout(() => toast.remove(), 250);
            }, 2600);
        }

        /* ── Init ── */
        fetchTodos();
    </script>
</body>
</html>
